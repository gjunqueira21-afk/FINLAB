# Modo Traefik: a VPS já tem um Traefik nas portas 80/443 (o proxy padrão da
# Hostinger, que publica as outras aplicações). O FinLab se anuncia a ele por
# labels — domínio, HTTPS e senha — sem subir um Caddy próprio.
#
# Ativado pelo instalar.sh, que grava COMPOSE_FILE no deploy/.env e descobre
# sozinho a rede, o entrypoint HTTPS e o resolvedor de certificado do Traefik.
# TRAEFIK_REDE é a rede Docker por onde o Traefik alcança o FinLab:
#   • Traefik em rede Docker → a rede dele; o FinLab entra nela pelo
#     docker-compose.traefik-rede.yml, somado ao COMPOSE_FILE;
#   • Traefik com network_mode: host (caso da Hostinger) → finlab_default,
#     a rede do próprio projeto: o host enxerga as redes bridge diretamente.
services:
  finlab:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_REDE}
      - traefik.http.routers.finlab.rule=Host(`${FINLAB_DOMINIO}`)
      - traefik.http.routers.finlab.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.finlab.tls=true
      - traefik.http.routers.finlab.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.finlab.middlewares=finlab-auth
      - traefik.http.routers.finlab.service=finlab
      - traefik.http.middlewares.finlab-auth.basicauth.users=${FINLAB_USUARIO}:${FINLAB_SENHA_HASH}
      - traefik.http.services.finlab.loadbalancer.server.port=8777
      # Ícone da tela de início SEM senha: o iPhone baixa o apple-touch-icon
      # numa requisição à parte, sem as credenciais do site — atrás da senha
      # ele recebe 401 e mostra uma letra no lugar do logo. Só estes arquivos,
      # um a um (imagens e o manifest com nome e ícones); nada de dados.
      - "traefik.http.routers.finlab-icones.rule=Host(`${FINLAB_DOMINIO}`) && (Path(`/apple-touch-icon.png`) || Path(`/apple-touch-icon-precomposed.png`) || Path(`/favicon.ico`) || Path(`/assets/manifest.webmanifest`) || Path(`/assets/icones/apple-touch-icon.png`) || Path(`/assets/icones/icone-192.png`) || Path(`/assets/icones/icone-512.png`) || Path(`/assets/icones/icone-maskable-512.png`) || Path(`/assets/icones/favicon-32.png`) || Path(`/assets/icones/favicon.svg`))"
      - traefik.http.routers.finlab-icones.priority=1000
      - traefik.http.routers.finlab-icones.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.finlab-icones.tls=true
      - traefik.http.routers.finlab-icones.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.finlab-icones.service=finlab

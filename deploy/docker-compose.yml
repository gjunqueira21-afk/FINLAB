# FinLab na VPS.
#   finlab — o painel (uvicorn), só visível dentro da rede do compose
#   caddy  — HTTPS automático (Let's Encrypt) + senha, para VPS sem proxy
#            (perfil "caddy"). Se a VPS já tem um Traefik nas portas 80/443,
#            o instalar.sh liga o docker-compose.traefik.yml no lugar dele.
# Configuração em deploy/.env (crie com instalar.sh; nunca vai para o git).
name: finlab

services:
  finlab:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      # Parquets da CVM e caches: fora da imagem, para git pull + rebuild
      # não jogar fora dados que levaram minutos para baixar.
      - dados_cvm:/app/valuation_cvm/data
      - dados_app:/app/finlab/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8777/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 600s   # a primeira carga da CVM demora
      retries: 5

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados Let's Encrypt
      - caddy_config:/config
    depends_on:
      - finlab

volumes:
  dados_cvm:
  dados_app:
  caddy_data:
  caddy_config:
